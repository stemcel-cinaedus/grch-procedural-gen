<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D BSP Procedural Generation Visualizer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
        }
        #json-upload {
            color: white; 
        }
        #json-upload::file-selector-button {
            color: white;
            background-color: #444;
            border: 1px solid #666;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-family: sans-serif;
        }
        #json-upload::file-selector-button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div id="info">3D BSP Procedural Generation<br/>Left Click: Rotate | Right Click: Pan | Scroll: Zoom</div>
    
    <input type="file" id="json-upload" accept=".json" style="position: absolute; top: 50px; width: 100%; text-align: center; z-index: 120;">

    <!-- Import map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
        import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
        import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';

        const scene = new THREE.Scene();
        // Add some fog to give depth to big boy structure
        scene.fog = new THREE.FogExp2(0x1a1a1a, 0.0002);

        // --- NEW: Add lighting so solid boxes have 3D definition ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4); 
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5000, 8000, 3000); // Angle light from above
        scene.add(directionalLight);
        // -----------------------------------------------------------

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 10000);
        camera.position.set(3000, 3000, 3000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(1024, 1024, 1024);
        controls.update();

        // --- NEW: Function to generate solid meshes instead of wireframes ---
        function createSolidBox(lc, rc, colorHex, opacity = 1.0) {
            const width = Math.abs(rc[0] - lc[0]);
            const height = Math.abs(rc[1] - lc[1]);
            const depth = Math.abs(rc[2] - lc[2]);

            const centerX = (lc[0] + rc[0]) / 2;
            const centerY = (lc[1] + rc[1]) / 2;
            const centerZ = (lc[2] + rc[2]) / 2;

            const geometry = new THREE.BoxGeometry(width, height, depth);
            
            // Lambert material reacts to the lights we added earlier
            const material = new THREE.MeshLambertMaterial({ 
                color: colorHex,
                transparent: opacity < 1.0,
                opacity: opacity,
                // Setting depthWrite to false for transparent objects prevents them 
                // from visually blocking other objects drawn behind them
                depthWrite: opacity === 1.0 
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(centerX, centerY, centerZ);
            
            // Tag it so we can easily find and delete it when loading a new file
            mesh.userData.isDungeonElement = true; 
            
            return mesh;
        }

        function renderEdges(scene, dungeonData) {
            const positions = [];

            if (dungeonData.Edges) {
                dungeonData.Edges.forEach(edge => {
                    positions.push(...edge.Start);
                    positions.push(...edge.End);
                });
            }

            const geometry = new LineSegmentsGeometry();
            geometry.setPositions(positions);

            const material = new LineMaterial({
                color: 0xC70000,
                linewidth: 6,
                worldUnits: false,
                dashed: false,
                alphaToCoverage: true,
                depthTest: true, 
                transparent: true
            });

            material.resolution.set(window.innerWidth, window.innerHeight);

            const edgeLines = new LineSegments2(geometry, material);
            edgeLines.userData.isDungeonElement = true; // Tag for cleanup
            scene.add(edgeLines);

            return edgeLines;
        }


        // summon json cube
        async function loadDungeon() {
            document.getElementById('json-upload').addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                    
                        // --- UPDATED: Cleanup logic based on userData tag ---
                        const objectsToRemove = [];
                        scene.traverse((child) => {
                            if (child.userData.isDungeonElement) objectsToRemove.push(child);
                        });
                        objectsToRemove.forEach(obj => {
                            scene.remove(obj);
                            // Dispose geometry/materials to prevent memory leaks in WebGL
                            if(obj.geometry) obj.geometry.dispose();
                            if(obj.material) obj.material.dispose();
                        });

                        let minX = Infinity, minY = Infinity, minZ = Infinity;
                        let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;

                        function expandBounds(pt) {
                            if (pt[0] < minX) minX = pt[0]; if (pt[1] < minY) minY = pt[1]; if (pt[2] < minZ) minZ = pt[2];
                            if (pt[0] > maxX) maxX = pt[0]; if (pt[1] > maxY) maxY = pt[1]; if (pt[2] > maxZ) maxZ = pt[2];
                        }

                        const tiles = data.Tiles || [];
                        tiles.forEach(tile => {
                            if (tile['Left Corner'] && tile['Right Corner']) {
                                // Draw BSP partition at 15% opacity so we can see inside
                                const partition = createSolidBox(tile['Left Corner'], tile['Right Corner'], 0x555555, 0.15);
                                scene.add(partition);
                                expandBounds(tile['Left Corner']);
                                expandBounds(tile['Right Corner']);
                            }
                            if (tile.Room && tile.Room['Left Corner'] && tile.Room['Right Corner']) {
                                // Draw Solid Room
                                const room = createSolidBox(tile.Room['Left Corner'], tile.Room['Right Corner'], 0x0088ff, 1.0);
                                scene.add(room);
                            }
                        });

                        const edgesMesh = renderEdges(scene, data);

                        if (minX !== Infinity) {
                            const mapCenterX = (minX + maxX) / 2;
                            const mapCenterY = (minY + maxY) / 2;
                            const mapCenterZ = (minZ + maxZ) / 2;
                            const mapSize = Math.max(maxX - minX, maxY - minY, maxZ - minZ);

                            controls.target.set(mapCenterX, mapCenterY, mapCenterZ);
                            camera.position.set(mapCenterX + mapSize, mapCenterY + mapSize, mapCenterZ + mapSize);
                            controls.update();
                        }

                    } catch (error) {
                        console.error("Error parsing JSON:", error);
                    }
                };
                reader.readAsText(file); 
            });
        }

        loadDungeon();

        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

       window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);

            scene.traverse((child) => {
                if (child.isLineSegments2) {
                    child.material.resolution.set(window.innerWidth, window.innerHeight);
                }
            });
        }
    </script>
</body>
</html>
